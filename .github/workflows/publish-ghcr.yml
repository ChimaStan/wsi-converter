name: Publish container image

on:
  push:
    tags:
      - "v*"

jobs:
  quality:
    name: Validate release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install project environment
        run: |
          uv python install
          uv sync --locked --group dev

      - name: Run quality checks
        run: |
          uv run ruff check .
          uv run mypy .
          uv run pytest

  publish:
    name: Build and publish to GHCR
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for runtime smoke check
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: wsi-converter:release-smoke
          cache-from: type=gha,scope=wsi-converter-release
          cache-to: type=gha,scope=wsi-converter-release,mode=max

      - name: Check dependencies inside the built image
        run: docker run --rm wsi-converter:release-smoke doctor

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wsi-converter-release
          cache-to: type=gha,scope=wsi-converter-release,mode=max
          provenance: true
          sbom: true

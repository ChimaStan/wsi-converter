name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      non_docs: ${{ steps.filter.outputs.non_docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          base: ${{ github.event.before == '0000000000000000000000000000000000000000' && github.event.repository.default_branch || github.event.before }}
          filters: |
            non_docs:
              - '**'
              - '!README.md'
              - '!CONTRIBUTING.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!LICENCE*'
          predicate-quantifier: some-with-excludes

  quality:
    needs: changes
    if: needs.changes.outputs.non_docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
